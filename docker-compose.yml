version: '3.8'

services:

  # 1. MySQL Database
  mysql:
    image: mysql:8.0
    container_name: authfy-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"  # Using 3307 on host to avoid conflict with your local MySQL
    networks:
      - authfy-net
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. The Cache (Redis) - NEW ADDITION 🚀
  redis:
    image: redis:7-alpine
    container_name: authfy-redis
    ports:
      - "6379:6379"
    networks:
      - authfy-net
    # Standard health check to ensure Redis is ready before Backend starts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. The Spring Boot Backend
  backend:
    build: ./backend  # Path to backend folder
    container_name: authfy-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD}
      # Redis Config - Pointing to the container name 'redis'
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
    depends_on:
      mysql:
        condition: service_healthy # Wait until MySQL is ready
      redis:
        condition: service_healthy # Wait until Redis says "I am ready"
    networks:
      - authfy-net

  # 3. The React Frontend
  frontend:
    build: ./client  # Path to frontend folder
    container_name: authfy-ui
    ports:
      - "3000:80"
    depends_on:
      - backend  # Wait for backend to start
    networks:
      - authfy-net
  
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: authfy-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #   networks:
  #     - authfy-net

  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: authfy-grafana
  #   ports:
  #     - "3001:3000" # We map to 3001 because React uses 3000
  #   networks:
  #     - authfy-net
  


# Create a private network for them to talk
networks:
  authfy-net:
    driver: bridge

# Persistent volumes for data
volumes:
  mysql_data:







