name: Build and Push Docker Images

on:
  push:
    branches: ["main"] # Runs whenever you push to main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- BACKEND BUILD ---
      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/authfy-backend:latest ./backend

      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/authfy-backend:latest

      # --- FRONTEND BUILD ---
      - name: Build Frontend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/authfy-frontend:latest ./client

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/authfy-frontend:latest
